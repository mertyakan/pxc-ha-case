#================================================================
#  HAProxy 1 — PRIMARY Load Balancer
#  Ports exposed:
#    3306 → Write backend  (pxc1 primary, pxc2/pxc3 backup)
#    3307 → Read  backend  (all nodes, round-robin)
#    8404 → Stats page     (http://localhost:8404/stats)
#================================================================

global
    log         stdout format raw local0
    maxconn     10000
    tune.ssl.default-dh-param 2048

defaults
    log         global
    mode        tcp
    option      tcplog
    option      dontlognull
    option      tcp-smart-accept
    retries     3
    timeout connect    5s
    timeout client    30s
    timeout server    30s
    timeout check      5s

#----------------------------------------------------------------
#  STATS  Page
#----------------------------------------------------------------
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats realm "HAProxy1 Statistics"
    stats auth admin:admin
    stats refresh 5s
    stats show-legends
    stats show-node

#----------------------------------------------------------------
#  WRITE  Frontend  (port 3306)
#  Routes to a single-primary write backend.
#  pxc1 is preferred; pxc2/pxc3 are backup.
#----------------------------------------------------------------
frontend mysql-write-front
    bind *:3306
    mode tcp
    default_backend mysql-write-back

backend mysql-write-back
    mode tcp
    balance    first              # Always use first healthy server
    option     mysql-check user haproxy_check

    # Health check query (lightweight)
    default-server inter 3s fall 3 rise 2

    server pxc1  pxc1:3306  check weight 100
    server pxc2  pxc2:3306  check weight 50  backup
    server pxc3  pxc3:3306  check weight 50  backup

#----------------------------------------------------------------
#  READ  Frontend  (port 3307)
#  Distributes SELECT load across all 3 nodes.
#----------------------------------------------------------------
frontend mysql-read-front
    bind *:3307
    mode tcp
    default_backend mysql-read-back

backend mysql-read-back
    mode tcp
    balance    roundrobin
    option     mysql-check user haproxy_check

    default-server inter 3s fall 3 rise 2

    server pxc1  pxc1:3306  check weight 100
    server pxc2  pxc2:3306  check weight 100
    server pxc3  pxc3:3306  check weight 100
